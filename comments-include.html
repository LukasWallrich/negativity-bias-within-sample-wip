<style>
@media (max-width: 899px) {
  .hc-composer {
    position: fixed !important;
    top: 8px !important;
    left: 8px !important;
    width: calc(100vw - 16px) !important;
    max-width: calc(100vw - 16px) !important;
    max-height: calc(100dvh - 16px) !important;
    overflow-y: auto !important;
  }
}
@media (prefers-color-scheme: dark) {
  .hc-composer, .hc-composer textarea, .hc-composer input {
    background: #23282e !important;
    color: #e5e9ee !important;
  }
  .hc-composer textarea::placeholder, .hc-composer input::placeholder {
    color: #9aa4af !important;
  }
  .hc-composer .hc-btn { background: #2c333b !important; color: #e5e9ee !important; border-color: #4b5563 !important; }
  .hc-composer .hc-btn-primary { background: #2563eb !important; color: #fff !important; border-color: #2563eb !important; }
}
</style>
<script>
(function () {
  window.HC_CONFIG = {
    endpoint: 'https://script.google.com/macros/s/AKfycbyx858xfSCgHQ8RmbfbMsdzcmzrkNs_JZVmqeEBVrH-S6g8YJbI32CY7if-k8oTzg-eyQ/exec',
    project: 'negativity-bias-within-sample-v2'
  };
  var BASE = 'https://html-comments.surge.sh/';
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = BASE + 'html-comments.css';
  document.head.appendChild(link);
  var script = document.createElement('script');
  script.src = BASE + 'html-comments.js';
  document.body.appendChild(script);
  document.addEventListener('mouseup', function () {
    setTimeout(function () {
      var toolbar = document.querySelector('.hc-toolbar');
      var selection = window.getSelection();
      if (!toolbar || !selection || selection.rangeCount === 0) return;
      var rect = selection.getRangeAt(0).getBoundingClientRect();
      var below = window.scrollY + rect.bottom + 8;
      if (below + toolbar.offsetHeight <= window.scrollY + window.innerHeight - 8) {
        toolbar.style.top = below + 'px';
      }
    }, 40);
  });
})();
</script>
